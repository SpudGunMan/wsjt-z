name: Build All Platforms

permissions:
  contents: write  # needed for creating/updating releases and uploading release assets
  actions: write  # for cache and upload-artifact in called workflows

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g., 3.0.0)"
        required: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Determine version
        id: version
        run: |
          sanitize_version() {
            local value="$1"
            value="${value#refs/tags/}"
            value="${value#v}"
            printf '%s' "$value"
          }

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "release" ]; then
            VERSION=$(sanitize_version "${GITHUB_REF_NAME:-${GITHUB_REF}}")
          else
            VERSION="${{ inputs.version }}"
            if [ -z "$VERSION" ]; then
              # Extract VERSION_Z from CMakeLists.txt
              VERSION=$(grep 'set (VERSION_Z' CMakeLists.txt | sed 's/.*set (VERSION_Z "\(.*\)").*/\1/')
            fi
            VERSION=$(sanitize_version "$VERSION")
          fi

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not determine version"
            exit 1
          fi

          echo "Building version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"

  build-macos:
    needs: prepare
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"

  build-linux:
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      hamlib_branch: "4.7.2"

  publish:
    name: Publish Artifacts
    runs-on: ubuntu-latest
    needs: [prepare, build-windows, build-macos, build-linux]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: all-artifacts

      - name: Normalize release asset names
        run: |
          mkdir -p release-assets

          find all-artifacts -type f | while IFS= read -r file; do
            artifact_dir="${file#all-artifacts/}"
            artifact_dir="${artifact_dir%%/*}"
            asset_name="${artifact_dir}-$(basename "$file")"

            cp -v "$file" "release-assets/$asset_name"
          done

      - name: List artifacts
        run: |
          echo "=== All Build Artifacts ==="
          find all-artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
